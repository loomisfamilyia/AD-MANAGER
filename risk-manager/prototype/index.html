.vh{display:flex;align-items:center;gap:8px;padding:6px 10px 2px;flex:none}.vh h2{flex:1;font-size:1.35rem;padding:0 6px}
.vh .btn{min-height:56px;min-width:56px;padding:0 12px}
.vb{flex:1;overflow-y:auto;padding:6px 20px 16px;min-height:0}
.vf{flex:none;padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:#fff}
.q-title{font-size:1.65rem;margin:8px 0 6px}.q-help{color:var(--mut);margin-bottom:14px}
.dots{display:flex;gap:7px;align-items:center;justify-content:center;flex:1}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--pri);display:block}.dots i.d{background:var(--pri)}.dots i.c{width:30px;border-radius:8px;background:var(--gold);border-color:#b98500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:132px;border-radius:22px;background:#f3f7ff;border:2.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 8px;text-align:center;transition:transform .15s}
.tile:active{transform:scale(.96)}.tile .e{font-size:2.75rem;line-height:1.1}.tile b{font:800 1.1rem var(--hf)}.tile span{font-size:.82rem;color:var(--mut);line-height:1.2}
.krow{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:8px 14px;border-radius:20px;background:#f3f7ff;border:2.5px solid var(--line);margin-bottom:10px;font:700 1.15rem var(--hf)}.krow .e{font-size:2.2rem}.krow .go{margin-left:auto;color:var(--pri);font-size:1.5rem}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:14px}.yn button{min-height:112px;border-radius:24px;border:3px solid var(--line);background:#fff;font:800 1.5rem var(--hf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.yn button span{font-size:2rem}.yn button[aria-pressed=true]{border-color:var(--pri);background:#e3ebff;color:var(--pri-d);box-shadow:0 0 0 4px #c9d8ff}.yn button[aria-pressed=true]::after{content:"✓ Picked";font-size:.85rem}
.step{display:grid;grid-template-columns:72px 1fr 72px;gap:10px;align-items:center}.step .btn{min-height:72px;font-size:2rem;padding:0}.step .inp{text-align:center;font-size:2rem}
.money{position:relative}.money b{position:absolute;left:18px;top:50%;transform:translateY(-50%);font:800 1.6rem var(--hf);color:var(--mut)}.money .inp{padding-left:42px}
.lookup{margin-top:14px}.scan{position:relative;overflow:hidden;border-radius:18px;background:#0f2447;color:#fff;padding:18px;font-weight:700;text-align:center}
.scan::after{content:"";position:absolute;left:0;right:0;height:46px;top:-46px;background:linear-gradient(transparent,rgba(120,200,255,.55),transparent);animation:scan 1.2s linear infinite}
.found{border:3px solid var(--ok);border-radius:18px;padding:14px;background:#f1fbf5}.found b{display:block;margin-bottom:4px}
.polaroid{background:#fff;padding:10px 10px 34px;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:rotate(-2.5deg);width:200px;margin:12px auto;border-radius:4px;position:relative;animation:develop 1.1s both}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#ddd}.flash{position:absolute;inset:0;background:#fff;animation:flash .7s both;pointer-events:none}
.help-box{background:#f3f7ff;border-radius:16px;padding:12px 14px;margin-top:10px}.help-box li{margin:6px 0}
.done-hero{text-align:center;padding:18px 6px}.done-hero .big{font-size:5rem;line-height:1.1;animation:pop .8s both}.done-hero h2{font-size:2rem;margin:6px 0}
.tip{background:#fff8dc;border:2px solid #f0d27a;border-radius:16px;padding:12px 14px;margin-top:14px;font-weight:600;animation:fadein .5s both}
/* detail */
.dhead{display:flex;gap:14px;align-items:center;padding:6px 0 10px}.dhead .big{font-size:3.4rem;line-height:1}.dhead .nmx{flex:1;min-width:0}.dhead h2{font-size:1.5rem;overflow-wrap:anywhere}
.dl{display:flex;flex-direction:column}.dl button,.dl div.r{display:flex;justify-content:space-between;gap:12px;min-height:56px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.dl .k{color:var(--mut);font-size:.95rem}.dl .v{font-weight:700;text-align:right;overflow-wrap:anywhere}.dl .v em{color:var(--pri);font-style:normal}
.sec{margin-top:22px}.sec h3{font-size:1.2rem;margin-bottom:8px}
.sysrow{display:flex;align-items:center;gap:8px;min-height:64px;border-bottom:1px solid var(--line)}.sysrow .t{flex:1;font-weight:700}.sysrow .t small{display:block;font-weight:500;color:var(--mut)}.sysrow .btn{min-width:56px;padding:0;font-size:1.8rem}
.sdot{width:22px;height:22px;display:inline-grid;place-items:center}
.total{background:#fff8dc;border-radius:16px;padding:12px 14px;font:800 1.15rem var(--hf);margin:10px 0;display:flex;justify-content:space-between}
.item{display:flex;gap:10px;align-items:center;min-height:60px;border-bottom:1px solid var(--line)}.item img{width:44px;height:44px;border-radius:8px;object-fit:cover}.item .t{flex:1;min-width:0;font-weight:700}.item small{display:block;color:var(--mut);font-weight:500}
.disc{margin-top:8px;background:#fff8dc;border-radius:12px;padding:10px 12px;font-weight:700;color:#5c4300;animation:fadein .5s both}
/* protect */
.cov{border:2.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;background:#fff}
.cov .ct{display:flex;gap:12px;align-items:center}.cov .ct svg{width:40px;height:46px;flex:none}.cov h3{font-size:1.15rem}.cov .sw{font-size:.88rem;font-weight:800}.cov p{margin:8px 0 12px;color:var(--mut);font-size:.98rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#e8eef9;padding:6px;border-radius:20px}.seg button{min-height:56px;border-radius:14px;font:800 1rem var(--hf);text-align:center;color:var(--pri-d)}
.seg button[aria-checked=true]{background:var(--pri);color:#fff}.seg button[aria-checked=true]::before{content:"✓ "}
.ink{stroke-dasharray:1;stroke-dashoffset:0}.ink.draw{animation:inkdraw 1s both}.pulse-s{animation:spulse 1.8s ease-in-out infinite;transform-origin:50% 50%}
.sumline{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
/* budget */
.tot{display:grid;grid-template-columns:76px 1fr 76px;gap:10px;align-items:center;margin:10px 0}.tot .btn{min-height:76px;font-size:2.2rem;padding:0}.tot .inp{text-align:center;font-size:2.2rem;min-height:76px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e8eef9;padding:6px;border-radius:20px}.seg2 button{min-height:56px;border-radius:14px;font:800 1.05rem var(--hf);text-align:center}.seg2 button[aria-pressed=true]{background:var(--pri);color:#fff}
.coins{display:flex;align-items:center;gap:10px;background:#fff8dc;border-radius:18px;padding:10px 14px;min-height:64px}.coins .pile{font-size:1.5rem;letter-spacing:-6px;flex:1;line-height:1.1;word-break:break-all}.coins b{font:800 1.15rem var(--hf)}
.bl{padding:10px 0;border-bottom:1px solid var(--line)}.bl .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bl .ctl{display:flex;align-items:center;gap:2px;margin-left:auto}.bl .top .t{flex:1 1 60px;min-width:0;font-weight:800;font-family:var(--hf)}.bl .top .t small{display:block;font:500 .85rem system-ui;color:var(--mut)}
.bl .btn{min-width:56px;padding:0;font-size:1.8rem}.bl .t small{white-space:nowrap}.nw{white-space:nowrap!important}.bl .amt{min-width:72px;text-align:center;font:800 1.15rem var(--hf)}.bar{height:14px;border-radius:9px;background:#e1e9f5;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f8cd4b,var(--gold));transition:width .5s;border-radius:9px}
/* chat */
.msgs{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:84%;padding:10px 14px;border-radius:20px;font-size:1.02rem;animation:pop .4s both;overflow-wrap:anywhere}.msg.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:6px}.msg.hq{align-self:flex-start;background:#eef3ff;border-bottom-left-radius:6px}
.typing{align-self:flex-start;background:#eef3ff;border-radius:20px;padding:10px 16px;letter-spacing:3px;font-weight:900;color:var(--mut)}
.chatin{display:flex;gap:8px;padding:8px 14px 12px}.chatin .inp{min-height:56px;font-size:1.1rem;font-weight:500;flex:1;min-width:0}.send{width:56px;height:56px;flex:none;border-radius:50%;background:var(--pri);color:#fff;font-size:1.4rem;display:grid;place-items:center;box-shadow:0 4px 0 var(--pri-d)}
/* list */
.mrow{display:flex;gap:14px;align-items:center;width:100%;min-height:76px;padding:8px 12px;border-radius:20px;background:#f3f7ff;border:2.5px solid var(--line);margin-bottom:10px;text-align:left}.mrow .e{font-size:2.3rem;width:48px;text-align:center}.mrow .t{flex:1;min-width:0}.mrow .t b{display:block;font:800 1.08rem var(--hf);overflow-wrap:anywhere}.mrow .t span{font-size:.9rem;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mrow svg{width:20px;height:23px}.gh{font:800 1rem var(--hf);color:var(--pri-d);margin:14px 0 8px;display:flex;gap:8px;align-items:center}
.tg-row{display:flex;align-items:center;gap:12px;min-height:64px;justify-content:space-between;font-weight:700;width:100%}.tg{width:62px;height:36px;border-radius:18px;background:#8493a8;position:relative;flex:none;transition:background .2s}.tg::after{content:"";position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .25s}.tg[aria-checked=true]{background:var(--pri)}.tg[aria-checked=true]::after{transform:translateX(26px)}
/* overlays */
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.pt{position:absolute;font-size:18px;line-height:1;animation:burst 1.4s cubic-bezier(.2,.7,.3,1) both;will-change:transform}
.pt.c{width:10px;height:14px;border-radius:2px;font-size:0}
.flt{position:absolute;font:900 1.5rem var(--hf);color:#8a5a00;text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:floatup 1.3s ease-out both;transform:translate(-50%,-50%)}
.plane{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px}
#banner{position:absolute;inset:0;z-index:70;background:radial-gradient(circle at 50% 40%,rgba(255,236,160,.97),rgba(255,255,255,.97));display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px}
#banner.on{display:flex;animation:fadein .6s both}#banner .big{font-size:6rem;line-height:1;animation:pop .9s both}#banner h2{font-size:2.1rem;color:var(--pri-d)}#banner p{font-size:1.3rem;font-weight:700}
#toasts{position:absolute;left:12px;right:12px;bottom:calc(var(--barh) + 98px);z-index:75;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:#14263d;color:#fff;border-radius:18px;padding:10px 16px;font-weight:700;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;animation:toastin .5s both;max-width:100%}.toast .btn{min-height:56px;background:var(--gold);color:#3b2a00;border-color:#b98500;padding:0 18px}.toast.out{animation:toastout .4s both}
#confirm{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(10,31,60,.55);padding:24px}#confirm.on{display:flex}
#confirm .box{background:#fff;border-radius:24px;padding:22px;width:100%;box-shadow:var(--sh);animation:pop .4s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes vin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}@keyframes vinb{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wanderA{0%{transform:translate(-8px,2px)}50%{transform:translate(9px,-4px)}100%{transform:translate(-3px,6px)}}@keyframes wanderB{0%{transform:translate(6px,-5px)}50%{transform:translate(-10px,4px)}100%{transform:translate(8px,5px)}}
@keyframes drop{0%{transform:translateY(-300px) scale(.85,1.2);opacity:0}30%{opacity:1}55%{transform:translateY(0) scale(1.3,.7)}70%{transform:translateY(-22px) scale(.9,1.12)}85%{transform:translateY(0) scale(1.1,.9)}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:none;opacity:1}}
@keyframes hop{0%,100%{transform:translate(-50%,-60%)}40%{transform:translate(-50%,-90%) scale(.95,1.1)}70%{transform:translate(-50%,-60%) scale(1.1,.9)}}
@keyframes sprout{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes terrin{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes cdrift{from{margin-left:-10px}to{margin-left:12px}}
@keyframes qpulse{0%{box-shadow:0 0 0 0 rgba(245,179,1,.9)}100%{box-shadow:0 0 0 22px rgba(245,179,1,0)}}
@keyframes addpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes dust{0%{opacity:.9;transform:translate(0,0) scale(.3)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2.4)}}
@keyframes cap{0%{opacity:0;transform:translateY(14px) scale(.9)}15%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
@keyframes burst{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r));opacity:0}}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-260%)}}
@keyframes toastin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@keyframes toastout{to{opacity:0;transform:translateY(10px)}}
@keyframes scan{from{top:-46px}to{top:100%}}
@keyframes flash{0%{opacity:1}100%{opacity:0}}@keyframes develop{from{filter:brightness(2) blur(2px);opacity:.3}to{filter:none;opacity:1}}
@keyframes flagidle{0%,100%{transform:skewY(-3deg)}50%{transform:skewY(4deg) scaleX(.95)}}@keyframes wave{0%,100%{transform:skewY(-10deg) scaleX(.9)}50%{transform:skewY(10deg) scaleX(1.1)}}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px #ffd24d) brightness(1.1)}}
@keyframes inkdraw{from{stroke-dashoffset:1;opacity:1}70%{stroke-dashoffset:0;opacity:1}to{stroke-dashoffset:0;opacity:0}}
@keyframes rise{from{clip-path:inset(100% 0 0 0);transform:translateY(34px)}to{clip-path:inset(-20% -20% -20% -20%);transform:none}}
.rising .bld{animation:rise 1.3s both cubic-bezier(.3,1.2,.5,1)!important}@keyframes spulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.7}}
.shd.requested svg,.lg .requested{animation:spulse 1.8s ease-in-out infinite}
/* reduced motion (OS setting or in-app toggle): movement becomes fades */
html.rm .bob,html.rm .wob,html.rm .cloud,html.rm .in-av,html.rm .guide .g,html.rm .prev,html.rm #addBtn.pulse,html.rm .flag,html.rm #hq.wave .flag,html.rm .pulse-s,html.rm .shd.requested svg,html.rm #avatar.hop,html.rm .scan::after,html.rm .qcheck{animation:none!important}
html.rm .dropping .em,html.rm .dropping .bld,html.rm .rising .bld,html.rm .terr.in,html.rm .fl,html.rm .msg,html.rm .done-hero .big,html.rm #banner .big,html.rm .ub.on,html.rm #confirm .box,html.rm .polaroid{animation:fadein .9s both!important}
html.rm .pt,html.rm .flt,html.rm .dust{display:none}
html.rm .view,html.rm .toast{animation:fadein .3s both!important}
html.rm .toast.out{animation:fadeout .3s both!important}
html.rm .sheet,html.rm .sheet.open{transform:none!important;transition:opacity .3s,visibility 0s!important}html.rm .sheet{opacity:0}html.rm .sheet.open{opacity:1}
html.rm #world,html.rm .ground,html.rm .fog,html.rm .cloud,html.rm #hq,html.rm .pbar i,html.rm .bar i{transition:none!important}
html.rm .ic{transition:opacity 1.6s!important;transform:none!important}html.rm .scan{animation:fadein 1s infinite alternate!important}
@keyframes fadeout{to{opacity:0}}
@media (min-width:431px){#phone{border-radius:28px;margin-top:max(0px,calc((100vh - 100dvh)/2));height:min(100dvh,900px);margin-top:calc((100dvh - min(100dvh,900px))/2)}}
@media (max-height:700px){.tile{min-height:110px}.tile .e{font-size:2.2rem}.q-title{font-size:1.4rem}}
</style>

function h(tag,p,...kids){const el=document.createElement(tag);if(p)for(const k in p){const v=p[k];if(v==null)continue;if(k.startsWith('aria-')){el.setAttribute(k,String(v));continue}if(v===false)continue;
 if(k==='class')el.className=v;else if(k==='style')el.style.cssText=v;else if(k==='html')el.innerHTML=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?'':v)}

/* ===================== sound (Web Audio, synthesized) ===================== */
const Snd=(()=>{let ctx,master,nb;
 function init(){if(ctx){if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx}
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ctx=new AC();master=ctx.createGain();master.gain.value=.25;master.connect(ctx.destination);
   nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;if(ctx.state==='suspended')ctx.resume().catch(()=>{})}catch(e){ctx=null}return ctx}
 function tone(f,t,d,type='sine',v=.4,f2,a=.005){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
 function noise(t,d,f1,f2,q,v,type='bandpass'){const s=ctx.createBufferSource();s.buffer=nb;const f=ctx.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+d);
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*.3);g.gain.linearRampToValueAtTime(0,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05)}
 const FX={
  tap:t=>tone(660,t,.03,'sine',.3,520),
  pop:t=>{tone(280,t,.14,'sine',.5,900);noise(t,.05,2500,6000,1,.18,'highpass')},
  chime:t=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.08,.7,'triangle',.32)),
  coin:t=>{tone(988,t,.18,'triangle',.35);tone(1319,t+.07,.3,'triangle',.35)},
  shimmer:t=>{noise(t,.7,2500,9000,5,.22);[1568,2093,2637].forEach((f,i)=>tone(f,t+i*.05,.9,'sine',.1))},
  whoosh:t=>noise(t,.4,300,1800,1.2,.5),
  fanfare:t=>{[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.14,.3,'square',.16));[783.99,1046.5,1318.5].forEach(f=>tone(f,t+.6,1,'triangle',.22))},
  send:t=>{noise(t,.55,400,3200,1.5,.45);tone(1568,t+.45,.8,'sine',.18);tone(2349,t+.5,.8,'sine',.1)},
  shutter:t=>{noise(t,.04,3000,3000,1,.5,'highpass');noise(t+.06,.05,2200,2200,1,.4,'highpass')},
  hmm:t=>{tone(440,t,.22,'sine',.22,420,.03);tone(349,t+.17,.3,'sine',.2,330,.03)}};
 function play(n){if(!S.soundOn)return;if(!init())return;try{FX[n](ctx.currentTime+.01)}catch(e){}}
 return{init,play}})();

function flyPlane(){return new Promise(res=>{const fx=$('#fx'),pr=phone.getBoundingClientRect(),hq=$('#hq'),hb=hq.getBoundingClientRect();
 const A={x:pr.width/2,y:pr.height-70},Bp={x:hb.left-pr.left+hb.width/2,y:hb.top-pr.top+hb.height*.42},Cp={x:Bp.x-pr.width*.55,y:(A.y+Bp.y)/2-40};
 const land=()=>{hq.classList.add('wave','glow');setTimeout(()=>hq.classList.remove('wave','glow'),3600);Snd.play('chime');buzz([30,40,30]);burst(Bp.x,Bp.y,20);caption('Your request is on its way to Loomis!');setTimeout(res,500)};
 const pl=h('div',{class:'plane',html:'<svg viewBox="0 0 44 44"><path d="M3 22 L41 5 L31 39 L21 28 Z" fill="#fff" stroke="#1d4ed8" stroke-width="2.6" stroke-linejoin="round"/><path d="M21 28 L41 5" stroke="#1d4ed8" stroke-width="2.2"/></svg>'});fx.append(pl);
 if(RM()){pl.style.transform=`translate(${Bp.x}px,${Bp.y}px)`;pl.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:900}).onfinish=()=>{pl.remove();land()};return}
 const key=[];for(let i=0;i<=30;i++){const u=i/30,x=(1-u)**2*A.x+2*(1-u)*u*Cp.x+u*u*Bp.x,y=(1-u)**2*A.y+2*(1-u)*u*Cp.y+u*u*Bp.y,dx=2*(1-u)*(Cp.x-A.x)+2*u*(Bp.x-Cp.x),dy=2*(1-u)*(Cp.y-A.y)+2*u*(Bp.y-Cp.y);
  key.push({transform:`translate(${x}px,${y}px) rotate(${Math.atan2(dy,dx)*180/Math.PI}deg) scale(${1-.4*u})`,opacity:u>.93?.2:1,offset:u})}
 const trail=setInterval(()=>{const r=pl.getBoundingClientRect();const s=h('span',{class:'pt',style:`left:${r.left-pr.left+22}px;top:${r.top-pr.top+22}px;--dx:0px;--dy:14px;--r:0deg;font-size:12px`},'✨');fx.append(s);setTimeout(()=>s.remove(),1500)},110);
 pl.animate(key,{duration:2200,easing:'cubic-bezier(.45,.05,.4,1)',fill:'forwards'}).onfinish=()=>{clearInterval(trail);pl.remove();land()}})}

/* ===================== my stuff, vault, menu ===================== */
function stuffRow(t,go){const st=shieldOf(t),fam=t.id==='fam';return h('button',{class:'mrow',type:'button',onclick:()=>{Snd.play('tap');go(t)}},h('span',{class:'e','aria-hidden':'true'},emojiOf(t)),
 h('span',{class:'t'},h('b',null,nameOf(t)),h('span',null,fam?'Umbrella and identity theft help':`${pctOf(t)}% complete`,h('span',{style:`display:inline-flex;align-items:center;gap:4px;font-weight:700;color:${st==='none'?'var(--mut)':'var(--pri)'}`},h('span',{html:shieldSVG(st),style:'display:inline-block'}),SWORD[st]))),h('span',{class:'go','aria-hidden':'true',style:'color:var(--pri);font-size:1.5rem'},'›'))}
const stuffGo=back=>t=>document.body.classList.contains('protect')?setView(viewCover(t,()=>setView(back(),true))):setView(viewDetail(t,()=>setView(back(),true)));
function viewStuff(){const body=[],go=stuffGo(viewStuff);
 CATS.forEach(c=>{const l=S.things.filter(t=>kindOf(t).cat===c.id);if(l.length)body.push(h('div',{class:'gh'},h('span',{'aria-hidden':'true'},c.e),c.l+` (${l.length})`),...l.map(t=>stuffRow(t,go)))});
 if(!S.things.length)body.push(h('div',{class:'done-hero'},h('div',{class:'big','aria-hidden':'true'},'🧺'),h('h3',null,'Nothing here yet'),h('p',{class:'note'},'Add your home, people, pets and more.')));
 body.push(h('div',{class:'gh'},h('span',{'aria-hidden':'true'},'☂️'),'Whole family'),stuffRow(S.fam,()=>setView(viewCover(S.fam,()=>setView(viewStuff(),true)))));
 return shell({head:simpleHead('My stuff'),body,foot:h('button',{class:'btn pri blk',onclick:()=>{closeSheet().then(()=>openAdd())}},'+ Add something')})}
const openStuff=()=>openSheet(viewStuff(),{tall:true});
function openVault(){const v=S.things.filter(t=>kindOf(t).cat==='valuables'),go=stuffGo(viewVault);openSheet(viewVault(),{tall:true});
 function viewVault(){return shell({head:simpleHead(`Vault (${v.length})`),body:[h('p',{class:'q-help'},'Your valuables are kept together in one chest.'),...v.map(t=>stuffRow(t,go)),v.length?null:h('p',{class:'tip'},'Nothing in the vault yet.')],
  foot:h('button',{class:'btn pri blk',onclick:()=>{closeSheet().then(()=>openAdd('valuables'))}},'+ Add a valuable')})}}
function sw(label,on,fn){const b=h('button',{class:'tg-row',type:'button',role:'switch','aria-checked':on,onclick:()=>{on=!on;b.setAttribute('aria-checked',on);$('.tg',b).setAttribute('aria-checked',on);fn(on)}},h('span',null,label),h('span',{class:'tg','aria-checked':on}));return b}
function openMenu(){openSheet(shell({head:simpleHead('Menu'),body:[
  sw('Reduce motion',S.reduce||RMq.matches,v=>{S.reduce=v;save();applyPrefs();Snd.play('tap');layout()}),sw('Sound',S.soundOn,v=>{S.soundOn=v;save();updateTop();Snd.play('tap')}),
  h('div',{class:'card',style:'margin:14px 0;box-shadow:none;background:#f3f7ff'},h('b',{class:'hf'},'About this prototype'),h('p',{class:'note',style:'margin-top:4px'},'Everything stays on this device. Property lookups and agency replies are demo data, labeled as such. Nothing here is insurance.')),
  h('button',{class:'btn dng blk',onclick:async()=>{if(await confirmBox('Start over?','This clears everything you added on this device.','Yes, start over')){reset();location.reload()}}},'Start over')]}),{})}

/* ===================== quests ===================== */
const QDONE={char:()=>S.stage==='world',home:()=>S.things.some(t=>kindOf(t).cat==='home'),people:()=>S.things.some(t=>t.kind==='person'),vehicle:()=>S.things.some(t=>kindOf(t).cat==='vehicles'),
 protect:()=>allPlan().some(t=>Object.values(t.cov).some(v=>v==='need'||v==='want')),budget:()=>S.budgetSet,visit:()=>S.visited};
let questBusy=false;
function checkQuests(){if(S.stage!=='world')return;const fresh=QUESTS.filter(q=>!S.quests[q[0]]&&QDONE[q[0]]());if(!fresh.length)return;
 fresh.forEach(q=>{S.quests[q[0]]=true;S.xp+=100});save();updateTop();questDone(fresh[0][1]+(fresh.length>1?` (+${fresh.length-1} more)`:''))}
function questDone(title){const q=$('#quest');questBusy=true;Snd.play('chime');buzz([20,30,20]);q.classList.remove('min','done');void q.offsetWidth;q.classList.add('done');
 q.replaceChildren(h('div',{class:'qrow'},h('div',{class:'qcheck',style:'animation:pop .6s both','aria-hidden':'true'},'✓'),h('div',{class:'qt'},h('b',null,'Quest complete!'),h('span',null,`${title} · +100 XP`))));
 const c=rel(q);burst(c.x,c.y+10,14);floatAt('+100 XP',c.x,c.y+30);setTimeout(()=>{questBusy=false;q.classList.remove('done');renderQuest();layout()},1900)}
function startQuest(id){Snd.play('tap');({home:()=>openAdd('home'),people:()=>openAdd('people'),vehicle:()=>openAdd('vehicles'),protect:()=>setProtect(true),budget:openBudget,visit:openChat}[id]||(()=>{}))()}
function renderQuest(){const q=$('#quest');if(questBusy)return;q.classList.toggle('on',S.stage==='world');q.classList.toggle('min',S.qMin);
 const next=QUESTS.find(x=>!S.quests[x[0]]),done=QUESTS.filter(x=>S.quests[x[0]]).length;
 const tg=h('button',{class:'ibtn','aria-label':S.qMin?'Show quest details':'Hide quest details','aria-expanded':!S.qMin,onclick:()=>{S.qMin=!S.qMin;save();Snd.play('tap');renderQuest();layout()}},S.qMin?'▾':'▴');
 if(!next){q.replaceChildren(h('div',{class:'qrow'},h('div',{class:'qcheck','aria-hidden':'true'},'🏆'),h('div',{class:'qt'},h('b',null,'All starter quests done!'),h('span',null,`⭐ ${S.xp} XP · keep growing your world`)),tg));return}
 q.replaceChildren(h('div',{class:'qrow'},h('div',{class:'qt'},h('b',null,'Next: '+next[1]),h('span',null,next[2])),h('button',{class:'btn pri',style:'min-height:56px;padding:0 16px',onclick:()=>startQuest(next[0])},'Start'),tg),
  h('div',{class:'qfoot'},`Quest ${done+1} of ${QUESTS.length} · ⭐ ${S.xp} XP`))}

/* ===================== screens + boot ===================== */
const RMq=window.matchMedia('(prefers-reduced-motion: reduce)');
function applyPrefs(){document.documentElement.classList.toggle('rm',!!(S.reduce||RMq.matches))}
const show=id=>{$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id))};
function startIntro(){show('intro');setTimeout(()=>{$$('.ic').forEach((c,i)=>{c.style.transform=`translate(${(i%2?1:-1)*(150+i*34)}px,${(i-2)*-14}px)`});$('#intro').classList.add('open')},450)}
function startChar(){S.stage='char';save();show('char');const g=$('#avGrid');g.replaceChildren(...AVATARS.map(a=>h('button',{class:'av',type:'button',role:'radio','aria-checked':a===S.avatar,'aria-label':'Look '+(AVATARS.indexOf(a)+1),onclick:()=>{S.avatar=a;Snd.play('pop');buzz(10);
  $$('.av',g).forEach(b=>b.setAttribute('aria-checked',b.textContent===a));$('#prevAv').textContent=a;const p=$('#prevAv');p.style.animation='none';void p.offsetWidth;p.style.animation=''}},a)));
 $('#prevAv').textContent=S.avatar;$('#nameIn').value=S.name;setTimeout(()=>$('#nameIn').focus({preventScroll:true}),300)}
function enterWorld(first){show('game');$('#world').classList.add('nt');S.lvl=levelIdx(S.things.length);refresh();requestAnimationFrame(()=>requestAnimationFrame(()=>$('#world').classList.remove('nt')));
 if(first)setTimeout(()=>{Snd.play('pop');checkQuests()},900);else renderQuest()}
function wire(){
 document.addEventListener('pointerdown',()=>Snd.init(),{passive:true});document.addEventListener('keydown',()=>Snd.init(),{passive:true});
 $('#beginBtn').onclick=()=>{Snd.play('chime');buzz(15);startChar()};
 $('#charNext').onclick=()=>{const v=$('#nameIn').value.trim();if(!v){$('#charHint').replaceChildren(h('div',{class:'hint',role:'alert'},'Type any name you like — even just a nickname.'));Snd.play('hmm');$('#nameIn').focus();return}
  S.name=v;S.stage='world';save();Snd.play('whoosh');enterWorld(true)};
 $('#nameIn').onkeydown=e=>{if(e.key==='Enter')$('#charNext').click()};
 $('#sndBtn').onclick=()=>{S.soundOn=!S.soundOn;save();updateTop();Snd.play('tap')};
 $('#szBtn').onclick=()=>{S.size=(S.size+1)%3;save();updateTop();Snd.play('tap');setTimeout(layout,50)};
 $('#menuBtn').onclick=()=>{Snd.play('tap');openMenu()};
 $('#chatBtn').onclick=()=>{Snd.play('tap');openChat()};
 const prot=()=>document.body.classList.contains('protect');
 $('#stuffBtn').onclick=()=>{Snd.play('tap');prot()?openFamily():openStuff()};
 $('#addBtn').onclick=()=>{Snd.play('tap');prot()?openPlan():openAdd()};
 $('#protBtn').onclick=()=>setProtect(!prot());
 scrim.addEventListener('click',()=>closeSheet());
 let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const w=$('#world');w.classList.add('nt');layout();requestAnimationFrame(()=>w.classList.remove('nt'))},80)});
 RMq.addEventListener&&RMq.addEventListener('change',applyPrefs)}
function boot(){load();applyPrefs();worldSetup();wire();
 if(S.stage==='world'&&S.name)enterWorld(false);else if(S.stage==='char')startChar();else startIntro()}
boot();
